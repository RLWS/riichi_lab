# 真实排位批次配置：机器人 A / 后端 v1.2.0（legacy_v1_2）。
# 预算与阈值暂沿用 B2 保守示例值，开局前必须由部署者确定真实预算。
# 端口遵循 arena_selfplay.yaml 双实例约定（8000=v1.2.0）；运行前须与实际部署核对。
# 平台 token 只经环境变量 RIICHI_DEV_BOT_TOKEN_V120 传入，不写入本文件。
online:
  endpoint_ranked: wss://game.riichi.dev/ws/ranked
  token_env: RIICHI_DEV_BOT_TOKEN_V120
  match_rounds: 8
  send_reserve_seconds: 0.5
  inbound_estimate_seconds: 0.5
  finish_timeout_seconds: 5.0
backend:
  adapter_profile: legacy_v1_2
  api_base: http://127.0.0.1:8012
  api_key_env: TRAIN_MJ_API_KEY_V120  # 两实例密钥若相同，可设同值的不同变量。
  timeout_seconds: 10.0
  revision:
    tag: v1.2.0
    commit: 758981ab9fb457c882ab9c577c9377976f97f42b
    branch_hint: main
  # 部署者声明，须与实际部署清单一致；API 不提供权重哈希。
  model_identity:
    turn_sha256: 532ca85655e42b37d037688e8ca71382b3f425e6f9057c42429b471c4d1c8dd7
    response_sha256: 3c9b43d3ac2ff0ac5a9b1e90a2a9a32bf1057f4d7f823f90bdc0caa3ce39e2d4
  response:
    pass_bias: null  # 使用该实例服务端默认（v1.2.0 api_local: pass_bias=2.0）。
ranked:
  max_games: 100  # 占位：真实局数待定。
  max_total_seconds: 0  # 0 不限制；正数到时后等待当前对局结束，不再开新局。
  session_timeout_seconds: 7200
  matchmaking_timeout_seconds: 300
  stop:
    max_fallbacks: 0
    max_defaulted: 0
    max_server_elapsed_ms: 8000
    min_bank_ms: 1000
    min_deadline_margin_ms: 500
