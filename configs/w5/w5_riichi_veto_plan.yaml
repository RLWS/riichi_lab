# W5 pre-registered plan: serving-time veto of late extra Riichi under threat.
# See docs/w5-riichi-veto-preregistration-2026-11-18.md.
# C = v1.4.0 Turn + v1.3.0 Response (control, no veto).
# T = v1.4.0 Turn + v1.3.0 veto + v1.3.0 Response (treatment).
# Opponents are three fixed v1.3.0 seats in both arms.
plan_version: 1
purpose: w5_riichi_veto
registered_at: "2026-11-18"
base_commit: 858e4f0

engine:
  game_mode: 4p-red-half
  rule: default_tenhou
  smoke_seed_range: [44501, 44502]
  stage1_seed_range: [44001, 44064]
  stage2_seed_range: [44065, 44128]

services:
  v130:
    source_root: outputs/v140_engineering_8seeds_20261112_113340/v1_3_0
    service_config: configs/v1_4_0_validation/service_v130.yaml
    weights_root: ../train_mj
    adapter_profile: full_state_v2
    revision:
      tag: v1.3.0
      commit: 1e5092f344fb69bcdf4697f683f2ecf15b9865d8
    model_identity:
      turn_sha256: 30f2811cd86beebad57d4da1428272b25b598fb64a6231b5a1760e11ec08bf90
      response_sha256: e1d8c58a2aa61cef23852f15fe5bb9c65014bc3916c52756fb8c4cd1cd956c51
    timeout_seconds: 30.0
    response:
      pass_bias: 1.5
      no_yaku_call_penalty: 0.0
  v140:
    source_root: outputs/v140_engineering_8seeds_20261112_113340/v1_4_0
    service_config: configs/v1_4_0_validation/service_v140.yaml
    weights_root: ../train_mj
    adapter_profile: full_state_v3
    revision:
      tag: null
      commit: 57e8fb336ed4aa7b19afd8ca1ef4ee4c41a96ed2
    model_identity:
      turn_sha256: eeaa87b9c122fd49dd917758f299430764d305acc69d46f8a84c333448646cfe
      response_sha256: 41403f23015ee6cc364f48975bbffd6124122a717a760eccc127d01efa18e3df
    timeout_seconds: 30.0
    response:
      action_biases:
        ron: 0.0
        kan: 1.5
        pon: 1.6
        chi: 1.8
      no_yaku_call_penalty: 0.0

arms:
  C: {turn: v140, response: v130, veto: null}
  T: {turn: v140, response: v130, veto: v130}

veto:
  arm: T
  scope: treatment_arm_only
  condition:
    opp_riichi_count_min: 1
    turn_number_min_exclusive: 12
  trigger:
    new_turn_kind: riichi_discard
    old_turn_kind: discard
  replacement: old_turn_discard
  old_state_projection: full_state_v2
  metadata_key: veto
  description: >-
    In the treatment arm, if v1.4.0 Turn selects riichi_discard while at least
    one opponent has declared Riichi and turn_number > 12, ask v1.3.0 Turn on a
    v2-normalized copy of the same state. If v1.3.0 selects discard, replace the
    action with that discard. Otherwise keep v1.4.0 unchanged.

capture:
  tasks: [turn]
  players: focal
  store_state_when: veto_applied
  store_full_state: true
  description: >-
    Retain full state only for focal-seat Turn decisions where the treatment
    veto was applied. All other decisions keep the compact state-stripped form.

analysis:
  primary_endpoint: first_veto_pair_deal_rate
  primary_unit: first_veto_pair
  direction: treatment_lower_deal_rate
  pairing: [seed, rotation, hand_id]
  confidence_level: 0.95
  bootstrap_resamples: 10000
  bootstrap_seed: 20261118
  minimum_pairs: 24
  supported_min_risk_difference: 0.10
  supported_ci_upper_bound: 0.0
  extension:
    stage1_stage: stage1
    stage2_stage: stage2
    count_field: first_veto_pairs
    extend_if_below: 24
    decision_basis: count_only_no_outcomes
    pooled_analysis_when_extended: true
  forbidden_seed_ranges:
    - [40001, 40008]
    - [41001, 41128]
    - [42001, 42128]
    - [43001, 43128]
  secondary:
    - first_veto_pair_win_rate
    - first_veto_pair_income_loss
    - game_level_rank_score
    - all_game_mean_rank_and_fourth_rate
    - veto_event_counts
  multiplicity: exploratory_unadjusted

artifacts:
  max_bytes: 2000000000
  snapshot_stride: 100
  full_snapshots_first_run: false

notes:
  - W5 is a serving-time veto, not a retraining or calibration experiment.
  - v1.3.0 Response is fixed in both arms; there is no Response contrast.
  - W2 formal seeds 42001-42128, W3e seeds 43001-43128, W1 seeds 41001-41128,
    and A3 seeds 40001-40008 are forbidden.
  - Smoke seeds 44501-44502 are engineering-only and excluded from statistics.
  - No global riichi/chi/pon penalty tuning is allowed.
  - W2 verdict remains insufficient; v1.3.0 default and v1.4.0 candidate are
    unchanged by W5.
