# B0/B1 单次验证客户端。真实验收见 docs/milestones/B1.md，不循环排位。
online:
  endpoint_validate: "wss://game.riichi.dev/ws/validate"
  token_env: RIICHI_DEV_BOT_TOKEN
  match_rounds: 4
  send_reserve_seconds: 0.1
  inbound_estimate_seconds: 0.1  # 入站网络估计，B1 必须实测调整
  finish_timeout_seconds: 5.0
backend:
  adapter_profile: full_state_v2
  api_base: "http://127.0.0.1:8000"
  api_key_env: TRAIN_MJ_API_KEY
  timeout_seconds: 10.0
  response:
    pass_bias: null
