# 真实排位批次配置：机器人 B / 后端 v1.3.0（full_state_v2）。
# 双臂对照批次，v1.3.0 后端监听 8013。
# 平台 token 只经环境变量 RIICHI_DEV_BOT_TOKEN_V130 传入，不写入本文件。
online:
  endpoint_ranked: wss://game.riichi.dev/ws/ranked
  token_env: RIICHI_DEV_BOT_TOKEN_V130
  match_rounds: 8
  send_reserve_seconds: 0.5
  inbound_estimate_seconds: 0.5
  finish_timeout_seconds: 5.0
  inference_extension_seconds: 0.75
  retry_transient_prediction: true
backend:
  adapter_profile: full_state_v2
  api_base: http://127.0.0.1:8013
  api_key_env: TRAIN_MJ_API_KEY_V130  # 两实例密钥若相同，可设同值的不同变量。
  timeout_seconds: 10.0
  revision:
    tag: v1.3.0
    commit: 1e5092f344fb69bcdf4697f683f2ecf15b9865d8
    branch_hint: codex/full-state-features
  # 已部署的 final.inference.pt 同时承载 Turn 和 Response；哈希在部署侧核验。
  model_identity:
    turn_sha256: 7e6ed0b8aa6161ecc0a0699f8a7f701393d9cce81ec31b65a5f239b261654e99
    response_sha256: 7e6ed0b8aa6161ecc0a0699f8a7f701393d9cce81ec31b65a5f239b261654e99
  response:
    pass_bias: null  # 使用该实例服务端默认（v1.3.0 api_local: pass_bias=1.5）。
ranked:
  max_games: 500
  max_total_seconds: 0  # 0 不限制；正数到时后等待当前对局结束，不再开新局。
  session_timeout_seconds: 7200
  matchmaking_timeout_seconds: 300
  stop:
    max_fallbacks: 3
    max_fallbacks_per_game: 1
    max_consecutive_degraded_predictions: 1
    max_defaulted: 0
    max_server_elapsed_ms: 8000
    min_bank_ms: 1000
    min_deadline_margin_ms: 500
