# 对拍配置（方案 §9；A2 实现）
# train_mj 以 tag 锁定（方案 §2）：TRAIN_MJ_ROOT 指向固定 tag 的只读 checkout，
# 默认不依赖开发者磁盘（CI 由任务注入）。
parity:
  train_mj_root: null         # 未设置时使用环境变量 TRAIN_MJ_ROOT
  profiles: [legacy_v1_2, full_state_v2]  # 各 profile 的 tag+commit 固定在 rilab/config.py
  python: null               # 默认当前 Python；须具备 train_mj 开发依赖（含 torch）
  fixtures_dir: "tests/fixtures"  # 黄金回归；源 XML 位于 TRAIN_MJ_ROOT/tests/fixtures/tenhou
  compare:
    snapshots: exact          # 快照逐字段精确比较（方案 §9）
    features_int_bool_exact: true
    features_float_tolerance: 0.0   # 确定编码要求逐位一致；容差仅在登记后允许
api_contract:
  api_base: "http://127.0.0.1:8000"
  golden_requests_dir: "tests/fixtures/http_contract"
