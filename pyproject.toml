[project]
name = "rilab"
version = "0.0.1"
description = "RiichiLab adapter: RiichiEnv <-> train_mj inference service, selfplay regression and riichi.dev online bot"
requires-python = ">=3.11,<3.12"
dependencies = [
    "riichienv==0.4.11",
    "httpx==0.28.1",
    "websockets==17.4",
    "PyYAML==6.0.3",
]

[project.scripts]
rilab = "rilab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rilab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
